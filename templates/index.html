<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spanish Flashcards</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; text-align: center; }
    #prompt { font-size: 28px; margin: 30px 0; }
    input { font-size: 18px; padding: 8px; width: 200px; }
    button { font-size: 18px; padding: 8px 16px; margin-left: 8px; }
    #feedback { margin-top: 20px; font-size: 18px; min-height: 24px; }
    #stats { margin-top: 30px; color: #555; }
  </style>
</head>
<body>
  <h1>🇪🇸 Spanish Flashcards</h1>
  <div id="prompt">Loading...</div>
  <input type="text" id="answer" placeholder="Type your answer" autofocus>
  <button onclick="submitAnswer()">Submit</button>
  <div id="feedback"></div>
  <div id="stats"></div>

  <script src="/static/script.js"></script>
</body>
</html>
